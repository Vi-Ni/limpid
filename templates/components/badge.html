{% if variant == 'success' %}<span class="inline-flex items-center rounded-md bg-success-50 px-2 py-0.5 text-xs font-medium text-success-700 ring-1 ring-inset ring-success-500/20">{{ label }}</span>
{% elif variant == 'warning' %}<span class="inline-flex items-center rounded-md bg-warning-50 px-2 py-0.5 text-xs font-medium text-warning-700 ring-1 ring-inset ring-warning-500/20">{{ label }}</span>
{% elif variant == 'danger' %}<span class="inline-flex items-center rounded-md bg-danger-50 px-2 py-0.5 text-xs font-medium text-danger-700 ring-1 ring-inset ring-danger-500/20">{{ label }}</span>
{% elif variant == 'neutral' %}<span class="inline-flex items-center rounded-md bg-bg-subtle px-2 py-0.5 text-xs font-medium text-text-muted ring-1 ring-inset ring-border">{{ label }}</span>
{% else %}<span class="inline-flex items-center rounded-md bg-primary-50 px-2 py-0.5 text-xs font-medium text-primary-700 ring-1 ring-inset ring-primary-500/20">{{ label }}</span>
{% endif %}
