{% load i18n %}
<div>
  <div class="mb-2 flex justify-between text-xs text-text-faint">
    <span>{% blocktrans with current=current total=total %}Step {{ current }} of {{ total }}{% endblocktrans %}</span>
  </div>
  <div class="h-1.5 w-full overflow-hidden rounded-full bg-bg-subtle">
    <div class="h-full rounded-full bg-primary-500 transition-all duration-500 ease-out" style="width: {% widthratio current total 100 %}%"></div>
  </div>
</div>
