{% load i18n %}
<span class="relative inline-block" x-data="{ open: false }">
  <button type="button"
          @click="open = !open"
          @click.outside="open = false"
          class="inline-flex h-4 w-4 items-center justify-center rounded-full text-[10px] font-medium text-text-faint hover:text-text-muted hover:bg-bg-subtle transition-colors"
          aria-describedby="tooltip-{{ id }}">
    ?
  </button>
  <!-- Desktop: popover -->
  <div x-show="open"
       x-transition:enter="transition ease-out duration-150"
       x-transition:enter-start="opacity-0 translate-y-1"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-100"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       id="tooltip-{{ id }}"
       role="tooltip"
       class="absolute bottom-full left-1/2 z-40 mb-2 hidden w-64 -translate-x-1/2 rounded-xl border border-border bg-bg-card p-4 text-sm text-text shadow-lg ring-1 ring-black/5 md:block">
    {{ text }}
  </div>
  <!-- Mobile: bottom sheet -->
  <div x-show="open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-4"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-4"
       class="fixed inset-x-0 bottom-0 z-50 rounded-t-2xl border-t border-border bg-bg-card p-5 shadow-lg md:hidden">
    <div class="mx-auto mb-3 h-1 w-10 rounded-full bg-border-strong"></div>
    <p class="text-sm text-text">{{ text }}</p>
    <button @click="open = false" class="btn-primary mt-3 w-full">
      {% trans "Got it" %}
    </button>
  </div>
  <div x-show="open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed inset-0 z-40 bg-black/20 md:hidden" @click="open = false"></div>
</span>
