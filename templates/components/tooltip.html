{% load i18n %}
<span class="relative inline-block"
      x-data="{ open: false }"
      @close-tooltips.window="open = false"
      @click.outside="open = false">
  <button type="button"
          @click.stop="let was = open; $dispatch('close-tooltips'); open = !was"
          class="inline-flex h-4 w-4 items-center justify-center rounded-full text-[10px] font-medium text-text-faint hover:text-text-muted hover:bg-bg-subtle transition-colors"
          aria-describedby="tooltip-{{ id }}">
    ?
  </button>
  <!-- Desktop: popover -->
  <span x-show="open"
       x-cloak
       x-transition:enter="transition ease-out duration-150"
       x-transition:enter-start="opacity-0 translate-y-1"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-100"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       id="tooltip-{{ id }}"
       role="tooltip"
       class="absolute bottom-full left-1/2 z-40 mb-2 hidden w-64 -translate-x-1/2 rounded-xl border border-border bg-bg-card p-4 text-sm normal-case tracking-normal font-normal leading-relaxed text-text shadow-lg ring-1 ring-black/5 md:block">
    {{ text }}
  </span>
  <!-- Mobile: bottom sheet -->
  <span x-show="open"
       x-cloak
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-4"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-4"
       class="fixed inset-x-0 bottom-0 z-50 block rounded-t-2xl border-t border-border bg-bg-card p-5 shadow-lg md:hidden">
    <span class="mx-auto mb-3 block h-1 w-10 rounded-full bg-border-strong"></span>
    <span class="block text-sm normal-case tracking-normal font-normal text-text">{{ text }}</span>
    <button @click="open = false" class="btn-primary mt-3 w-full">
      {% trans "Got it" %}
    </button>
  </span>
  <span x-show="open"
       x-cloak
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed inset-0 z-40 block bg-black/20 md:hidden" @click="open = false"></span>
</span>
