{% load i18n %}
<div class="rounded-2xl border bg-bg-card {% if variant == 'warning' %}border-warning-400/40{% elif variant == 'success' %}border-success-400/40{% elif variant == 'elevated' %}border-border shadow-md shadow-black/[0.03]{% else %}border-border{% endif %} p-5 sm:p-6">
  {% if title %}
  <div class="mb-4 flex items-center gap-1.5">
    <h3 class="text-[0.8125rem] font-medium uppercase tracking-wide text-text-muted">
      {% if icon %}<span class="mr-1.5 inline-block align-middle">{{ icon }}</span>{% endif %}
      {{ title }}
    </h3>
    {% if tooltip_id %}
      {% include "components/tooltip.html" with id=tooltip_id text=tooltip_text %}
    {% endif %}
  </div>
  {% endif %}
  <div>
