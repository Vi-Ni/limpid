{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 — {% trans "Server error" %}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
  <style>
    body { font-family: 'Geist', system-ui, sans-serif; background: #fafaf9; color: #1c1917; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; -webkit-font-smoothing: antialiased; }
    .container { text-align: center; }
    .icon { display: inline-flex; height: 48px; width: 48px; align-items: center; justify-content: center; border-radius: 16px; background: #f5f5f4; color: #a8a29e; }
    .code { margin-top: 16px; font-size: 2.25rem; font-weight: 600; letter-spacing: -0.025em; color: #a8a29e; font-variant-numeric: tabular-nums; }
    h1 { margin-top: 8px; font-size: 0.875rem; font-weight: 600; }
    p { margin-top: 4px; font-size: 0.875rem; color: #78716c; }
    a { display: inline-block; margin-top: 24px; font-size: 0.875rem; color: #4e4ddb; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    </div>
    <p class="code">500</p>
    <h1>{% trans "Server error" %}</h1>
    <p>{% trans "Something went wrong. Please try again later." %}</p>
    <a href="/">{% trans "Back to home" %}</a>
  </div>
</body>
</html>
