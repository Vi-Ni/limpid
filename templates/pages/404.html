{% extends "base.html" %}
{% load i18n %}

{% block title %}404 — {% trans "Page not found" %}{% endblock %}

{% block content %}
<div class="animate-enter">
  <div class="flex flex-col items-center py-24 text-center">
    <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-bg-subtle text-text-faint">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.182 16.318A4.486 4.486 0 0012.016 15a4.486 4.486 0 00-3.198 1.318M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75zm-.375 0h.008v.015h-.008V9.75zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75zm-.375 0h.008v.015h-.008V9.75z" />
      </svg>
    </div>
    <p class="mt-4 text-4xl font-semibold tracking-tight text-text-faint font-mono">404</p>
    <h1 class="mt-2 text-sm font-semibold text-text">{% trans "Page not found" %}</h1>
    <p class="mt-1 max-w-sm text-sm text-text-muted">{% trans "The page you are looking for does not exist." %}</p>
    <a href="{% url 'home' %}" class="btn-primary mt-6">{% trans "Back to home" %}</a>
  </div>
</div>
{% endblock %}
