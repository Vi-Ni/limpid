{% load i18n %}

<form hx-post="{% if editing %}{% url 'real_estate:edit_valuation' property.pk valuation.pk %}{% else %}{% url 'real_estate:add_valuation' property.pk %}{% endif %}"
      hx-target="#valuation-list"
      hx-swap="innerHTML"
      class="mt-4 p-4 rounded-lg border border-border bg-gray-50">
  {% csrf_token %}
  <div class="grid gap-3 sm:grid-cols-2">
    {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="block text-xs font-medium text-text mb-1">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<p class="mt-1 text-xs text-danger-600">{{ field.errors.0 }}</p>{% endif %}
    </div>
    {% endfor %}
  </div>
  {% if form.non_field_errors %}
  <p class="mt-2 text-sm text-danger-600">{{ form.non_field_errors.0 }}</p>
  {% endif %}
  <div class="mt-3 flex gap-2">
    <button type="submit" class="rounded-lg bg-primary-600 px-4 py-1.5 text-sm font-medium text-white hover:bg-primary-700">
      {% if editing %}{% trans "Save" %}{% else %}{% trans "Add" %}{% endif %}
    </button>
    <button type="button"
            onclick="this.closest('form').remove()"
            class="rounded-lg border border-border px-4 py-1.5 text-sm text-text-muted hover:bg-gray-50">
      {% trans "Cancel" %}
    </button>
  </div>
</form>
