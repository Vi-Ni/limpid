{% load i18n %}

<form hx-post="{% if editing %}{% url 'real_estate:edit_tax' property.pk tax.pk %}{% else %}{% url 'real_estate:add_tax' property.pk %}{% endif %}"
      hx-target="#tax-list"
      hx-swap="innerHTML"
      class="mt-4 space-y-3">
  <div class="grid gap-3 sm:grid-cols-3">
    {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-text">{{ field.label }}</label>
      {{ field }}
    </div>
    {% endfor %}
  </div>
  {% if form.non_field_errors %}
  <p class="text-sm text-danger-600">{{ form.non_field_errors.0 }}</p>
  {% endif %}
  <div class="flex gap-2">
    <button type="submit" class="btn-primary">
      {% trans "Save" %}
    </button>
    <button type="button"
            onclick="this.closest('form').remove()"
            class="btn-ghost">
      {% trans "Cancel" %}
    </button>
  </div>
</form>
